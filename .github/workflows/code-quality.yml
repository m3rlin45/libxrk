name: Code Quality

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  black:
    runs-on: ubuntu-latest
    name: Check code formatting with Black

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Check formatting with Black
      run: uv run black --check .

  mypy:
    runs-on: ubuntu-latest
    name: Type checking with mypy

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Run mypy
      run: uv run mypy .

  pytest:
    runs-on: ${{ matrix.os }}
    name: Run tests on ${{ matrix.os }} Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true  # Pull test data files if using Git LFS

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev g++

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install dependencies
      run: |
        uv sync --python ${{ matrix.python-version }}

    - name: Run pytest
      run: |
        uv run pytest tests/ -v --tb=short

    - name: Run pytest (Rust backend)
      run: |
        uv run pytest tests/ -v --tb=short
      env:
        LIBXRK_BACKEND: rust

    - name: Run spec tests (full)
      run: |
        uv run pytest spec/tests/ -v --tb=short

    - name: Run spec tests (Rust backend)
      run: |
        uv run pytest spec/tests/ -v --tb=short
      env:
        LIBXRK_BACKEND: rust
