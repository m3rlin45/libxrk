name: Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish to PyPI'
        required: true
        default: 'false'
        type: boolean

jobs:
  build-cpython-wheels:
    name: Build CPython wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install cibuildwheel
      run: python -m pip install cibuildwheel==2.21.3

    - name: Build wheels
      run: python -m cibuildwheel --output-dir wheelhouse
      env:
        CIBW_BUILD: "cp312-*"
        CIBW_SKIP: "*-musllinux_*"
        CIBW_ARCHS_LINUX: "x86_64 aarch64"
        CIBW_ARCHS_MACOS: "x86_64 arm64"
        CIBW_BUILD_VERBOSITY: 1
        CIBW_BEFORE_BUILD: "pip install numpy cython"

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: cpython-wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl

  build-pyodide-wheel:
    name: Build Pyodide (WebAssembly) wheel
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Emscripten SDK
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: '3.1.58'

    - name: Install pyodide-build
      run: pip install pyodide-build==0.27.3

    - name: Install Pyodide xbuildenv 0.27.3
      run: pyodide xbuildenv install 0.27.3

    - name: Build wheel for Pyodide
      run: pyodide build --exports whole_archive

    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: pyodide-wheel
        path: dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build sdist
      run: poetry build --format sdist

    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  test-pyodide-wheel:
    name: Test Pyodide wheel
    runs-on: ubuntu-latest
    needs: build-pyodide-wheel

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Download wheel artifact
      uses: actions/download-artifact@v4
      with:
        name: pyodide-wheel
        path: dist/

    - name: Install Pyodide
      run: npm install pyodide@0.27.3

    - name: Run unit tests in Pyodide
      run: node scripts/run_pyodide_tests.mjs --dist-dir=./dist

    - name: Run bytes input tests in Pyodide
      run: node scripts/run_pyodide_tests_idbfs.mjs --dist-dir=./dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-cpython-wheels, build-pyodide-wheel, build-sdist, test-pyodide-wheel]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi == true)
    environment:
      name: pypi
      url: https://pypi.org/p/libxrk

    permissions:
      id-token: write  # Required for trusted publishing

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist/
        merge-multiple: true

    - name: List artifacts
      run: ls -la dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
