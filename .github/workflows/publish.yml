name: Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish to PyPI'
        required: true
        default: 'false'
        type: boolean

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64 wheel
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install cibuildwheel
      run: python -m pip install cibuildwheel==2.21.3

    - name: Build wheel
      run: python -m cibuildwheel --output-dir wheelhouse
      env:
        CIBW_BUILD: "cp312-manylinux_x86_64"
        CIBW_BUILD_VERBOSITY: 1
        CIBW_BEFORE_BUILD: "pip install numpy cython"

    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: wheel-linux-x86_64
        path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build sdist
      run: poetry build --format sdist

    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  test-linux-x86_64-wheel:
    name: Test Linux x86_64 wheel
    runs-on: ubuntu-latest
    needs: build-linux-x86_64

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Download wheel artifact
      uses: actions/download-artifact@v4
      with:
        name: wheel-linux-x86_64
        path: dist/

    - name: Install wheel and test dependencies
      run: |
        pip install dist/*.whl
        pip install pytest

    - name: Run tests
      run: pytest tests/ -v --tb=short

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-linux-x86_64, build-sdist, test-linux-x86_64-wheel]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi == true)
    environment:
      name: pypi
      url: https://pypi.org/p/libxrk

    permissions:
      id-token: write  # Required for trusted publishing

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist/
        merge-multiple: true

    - name: List artifacts
      run: ls -la dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
