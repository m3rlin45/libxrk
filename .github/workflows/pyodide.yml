name: Pyodide (WebAssembly) Tests

on:
  workflow_call:

env:
  # Version of the pyodide-build TOOL. Deliberately not tied to the Pyodide
  # runtime version below — see the "Install pyodide-build" step.
  PYODIDE_BUILD_VERSION: "0.39.0"
  # Pyodide 314 = Python 3.14 = PyEmscripten 2026_0 (PEP 783), published to
  # PyPI. Keep in step with the versions in the justfile and package.json.
  PYODIDE_VERSION: "314.0.4"
  PYTHON_VERSION: "3.14"
  EMSCRIPTEN_VERSION: "5.0.3"
  # Must match `pyodide config get rust_toolchain` for this runtime. Pinned
  # rather than "stable" so a stable bump cannot silently change the compiler
  # used for a release wheel.
  RUST_TOOLCHAIN: "1.93.0"

jobs:
  pyodide-build:
    runs-on: ubuntu-latest
    name: Build wheel for Pyodide

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install Rust with wasm32-unknown-emscripten
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        targets: wasm32-unknown-emscripten

    - name: Install Emscripten SDK
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: ${{ env.EMSCRIPTEN_VERSION }}

    # pyodide-build is a BUILD TOOL and its version is independent of the
    # Pyodide RUNTIME version being targeted. Pinning it to the runtime version
    # (pyodide-build==0.27.3 / ==0.29.3) is what broke this workflow: those
    # releases hardcode a cross-build-environment metadata URL,
    # https://raw.githubusercontent.com/pyodide/pyodide/main/pyodide-cross-build-environments.json
    # which upstream has since removed, so `xbuildenv install` died on a 404.
    #
    # The runtime is selected by the argument to `xbuildenv install` below.
    # Keep this pinned (for reproducibility) and independent of the runtime.
    - name: Install pyodide-build
      run: |
        uv pip install --system --prerelease=allow "wheel<0.44.0"
        uv pip install --system --prerelease=allow pyodide-build==${{ env.PYODIDE_BUILD_VERSION }}

    - name: Install Pyodide xbuildenv
      run: pyodide xbuildenv install ${{ env.PYODIDE_VERSION }}

    - name: Build wheel for Pyodide
      run: pyodide build --exports whole_archive
      env:
        RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        CARGO_BUILD_TARGET: wasm32-unknown-emscripten
        # Must match `pyodide config get rustflags` for this runtime.
        RUSTFLAGS: "-C link-arg=-sSIDE_MODULE=2"
        PYO3_CROSS_PYTHON_VERSION: ${{ env.PYTHON_VERSION }}

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: pyodide-wheel
        path: dist/*.whl
        retention-days: 7

  pyodide-test:
    runs-on: ubuntu-latest
    needs: pyodide-build
    name: Test with Pyodide

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Download wheel artifact
      uses: actions/download-artifact@v4
      with:
        name: pyodide-wheel
        path: dist/

    - name: Install Pyodide
      run: npm install

    - name: Run unit tests in Pyodide
      run: node scripts/run_pyodide_tests.mjs --dist-dir=./dist

    - name: Run unit tests in Pyodide (Rust backend)
      run: node scripts/run_pyodide_tests.mjs --dist-dir=./dist --backend=rust

    - name: Run bytes input tests in Pyodide
      run: node scripts/run_pyodide_tests_idbfs.mjs --dist-dir=./dist

    - name: Run bytes input tests in Pyodide (Rust backend)
      run: node scripts/run_pyodide_tests_idbfs.mjs --dist-dir=./dist --backend=rust
