[package]
name = "libxrk-python"
version = "0.14.1"
edition = "2021"
publish = false

[lib]
name = "_aim_xrk_rs"
crate-type = ["cdylib"]

[dependencies]
libxrk = { path = "../libxrk", features = ["arrow"] }
pyo3 = { version = "0.26", features = ["extension-module"] }
arrow = { workspace = true, features = ["pyarrow"] }
