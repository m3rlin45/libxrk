[package]
name = "libxrk-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "C ABI for libxrk: sessions as opaque handles, channels and laps via the Arrow C Data Interface, metadata as JSON"

[lib]
name = "xrk_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
libxrk = { path = "../libxrk", features = ["arrow"] }
arrow = { workspace = true, features = ["ffi"] }
serde_json = "1"
ryu = "1"
