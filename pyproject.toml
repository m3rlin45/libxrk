[project]
name = "libxrk"
version = "0.10.1"
description = "Library for reading AIM XRK files from AIM automotive data loggers"
authors = [
    {name = "Christopher Dewan",email = "chris.dewan@m3rlin.net"}
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26.0; python_version < '3.13'",
    "numpy>=2.1.0; python_version >= '3.13' and python_version < '3.14'",
    "numpy>=2.4.0; python_version >= '3.14'",
    "cython>=3.0.0",
    "pyarrow>=18.1.0; python_version < '3.14'",
    "pyarrow>=22.0.0; python_version >= '3.14'",
]

[project.urls]
Homepage = "https://github.com/m3rlin45/libxrk"
Repository = "https://github.com/m3rlin45/libxrk"
Issues = "https://github.com/m3rlin45/libxrk/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "parameterized>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "setuptools>=68.0.0",
    "black>=25.11.0,<26.0.0",
    "mypy>=1.18.2",
    "pyodide-build>=0.27.3; python_version >= '3.12'",
    "parameterized>=0.9.0",
    "py-spy>=0.4.1",
    "construct>=2.10.0",
    "pyyaml>=6.0",
    "pytest-xdist>=3.8.0",
    "maturin>=1.11.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libxrk = ["*.so", "*.pyd", "*.pyi", "py.typed", "CLAUDE.md"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

# Exclude build artifacts, Cython files, DLL comparison test utilities, and one-off scripts
exclude = [
    "^build/",
    "^dist/",
    "\\.pyx$",
    "^tests/reference_dll/",
    "^spec/",
    "^scripts/investigate_missing_data/",
]

[[tool.mypy.overrides]]
module = "Cython.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "setuptools.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "parameterized.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aim_dll_wrapper"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "construct.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.maturin]
python-source = "src"
module-name = "libxrk._aim_xrk_rs"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
build-verbosity = 1

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
before-build = "pip install numpy cython"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
before-build = "pip install numpy cython"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.13" }

[tool.cibuildwheel.windows]
# ARM64 excluded until pyarrow publishes Windows ARM64 wheels
archs = ["AMD64"]
before-build = "pip install numpy cython"

[build-system]
requires = [
    "setuptools>=68.0.0",
    "cython>=3.0.0",
    "numpy>=1.26.0; python_version < '3.13'",
    "numpy>=2.1.0; python_version >= '3.13' and python_version < '3.14'",
    "numpy>=2.4.0; python_version >= '3.14'",
]
build-backend = "setuptools.build_meta"
